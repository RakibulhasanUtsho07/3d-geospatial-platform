name: P3.3 Ahsan Manzil model correction loop

on:
  push:
    branches:
      - rakibul-hasan
    paths:
      - 'data/heritage/ahsan-manzil.parameters.json'
      - 'public/models/ahsan-manzil.manifest.json'
      - 'data/heritage/ahsan-manzil-reference-pack.json'
      - 'scripts/fetch-ahsan-manzil-reference-pack.mjs'
      - 'tests/ahsan-manzil-reference-pack.test.mjs'
      - 'scripts/build-ahsan-manzil-model.mjs'
      - 'scripts/blender/render-building-review.py'
      - 'docs/BLENDER-RENDER-REVIEW.md'
      - 'tests/heritage-model.test.mjs'
      - 'docs/heritage/ahsan-manzil-deviation-report.md'
      - '.github/workflows/p3-3-ahsan-manzil-render.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: p3-3-ahsan-manzil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-review:
    name: Build corrected GLB, QA and render 13 views
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm install

      - name: Build corrected LOD models
        run: npm run build:heritage-model

      - name: Fetch and verify licensed multi-view source references
        run: |
          npm run test:ahsan-manzil-reference-pack
          npm run fetch:ahsan-manzil-reference-pack -- artifacts/p3-3-reference-pack

      - name: Run model and GLB quality tests
        run: |
          npm run test:heritage-model
          npm run test:glb-geometry-qa
          npm run test:glb-texture-binding-qa

      - name: Create QA reports for the exact candidate model
        run: |
          mkdir -p artifacts/p3-3-qa
          node scripts/create-render-correction-qa-evidence.mjs \
            public/models/ahsan-manzil-lod3.glb \
            artifacts/p3-3-qa/geometry-qa-report.json \
            artifacts/p3-3-qa/texture-qa-report.json
          npm run audit:ahsan-manzil-topology -- \
            public/models/ahsan-manzil-lod3.glb \
            artifacts/p3-3-qa/geometry-qa-report.json \
            artifacts/p3-3-qa/topology-audit.json \
            docs/heritage/p3.3-topology-audit.md

      - name: Install Blender and contact-sheet library
        run: |
          timeout 60s sudo apt-get update -qq || echo 'Proceeding with the runner package index if update times out.'
          DEBIAN_FRONTEND=noninteractive timeout 900s sudo apt-get install -y --no-install-recommends blender python3-pil python3-numpy libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri

      - name: Render all 13 review views
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
        run: |
          npm run render:building-review -- \
            public/models/ahsan-manzil-lod3.glb \
            artifacts/p3-3-render-set \
            --resolution=1024 --blender=blender
          cp artifacts/p3-3-qa/geometry-qa-report.json artifacts/p3-3-render-set/
          cp artifacts/p3-3-qa/texture-qa-report.json artifacts/p3-3-render-set/
          mkdir -p artifacts/p3-3-render-set/reference-pack
          cp -R artifacts/p3-3-reference-pack/. artifacts/p3-3-render-set/reference-pack/

      - name: Build labeled contact sheet
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          root = Path("artifacts/p3-3-render-set")
          views = ["front", "back", "left", "right", "top"] + ["turntable-" + str(a).zfill(3) for a in range(0, 360, 45)]
          thumb, label_h, cols = 256, 28, 4
          rows = (len(views) + cols - 1) // cols
          sheet = Image.new("RGB", (cols * thumb, rows * (thumb + label_h)), (242, 238, 232))
          draw = ImageDraw.Draw(sheet)
          for i, view_id in enumerate(views):
              with Image.open(root / (view_id + ".png")) as source:
                  image = source.convert("RGB").resize((thumb, thumb), Image.Resampling.LANCZOS)
              x, y = (i % cols) * thumb, (i // cols) * (thumb + label_h)
              sheet.paste(image, (x, y))
              draw.text((x + 8, y + thumb + 6), view_id, fill=(30, 30, 30))
          sheet.save(root / "contact-sheet.png", optimize=True)
          PY

      - name: Record exact GLB, QA and render hashes
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";
          import path from "node:path";
          const out = "artifacts/p3-3-render-set";
          const hash = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const manifestBytes = await readFile(path.join(out, "render-review-manifest.json"));
          const manifest = JSON.parse(manifestBytes.toString("utf8"));
          const geometryBytes = await readFile(path.join(out, "geometry-qa-report.json"));
          const textureBytes = await readFile(path.join(out, "texture-qa-report.json"));
          const geometry = JSON.parse(geometryBytes.toString("utf8"));
          const texture = JSON.parse(textureBytes.toString("utf8"));
          const referencePackBytes = await readFile(path.join(out, "reference-pack", "reference-pack.manifest.json"));
          const referencePack = JSON.parse(referencePackBytes.toString("utf8"));
          if (referencePack.verified !== true || referencePack.sources?.length < 3 || referencePack.sources.some((source) => source.verified !== true || !/^[a-f0-9]{64}$/.test(source.sha256 || ""))) {
            throw new Error("P3.3 requires at least three downloaded, hash-verified licensed Ahsan Manzil reference views");
          }
          const views = (manifest.views || []).map((view) => ({
            id: view.id,
            filename: view.filename,
            width: view.width,
            height: view.height,
            sha256: view.sha256
          }));
          if (views.length !== 13 || new Set(views.map((view) => view.id)).size !== 13) {
            throw new Error("P3.3 expected 13 unique render views; got " + views.length);
          }
          const glbBytes = await readFile("public/models/ahsan-manzil-lod3.glb");
          const summary = {
            task: "P3.3",
            building: "Ahsan Manzil (Pink Palace), Dhaka",
            sourceCommit: process.env.SOURCE_COMMIT,
            reviewGeneratedAt: new Date().toISOString(),
            correctionScope: [
              "add a 14.0 m × 12.0 m estimated raised central roof platform beneath the drum to express the roof-section transition; both dimensions remain [E]",
              "add a CC BY-SA 4.0 aerial roof reference for qualitative roof-plane review only; camera calibration and surveyed roof plan remain unknown",
              "Rangmahal and Andarmahal roof-height separation",
              "photo-proportion-based 13.0 m triple-arch portico and 27.0 m estimated stair base; neither is surveyed",
              "16 m ceremonial stair run with 28 discrete risers/treads and contrasting nosing",
              "10.5 m estimated octagonal drum with proportionally scaled 5.25 m maximum dome radius and unchanged 6.53 m profile height",
              "wider/taller arched openings, LOD3 arch keystones and imposts, profile-following dome meridian ribs",
              "rebalanced deterministic review lighting to preserve salmon facade tone and opening recesses",
              "use a separate grey-brown RoofDeck material informed by the licensed aerial view; preserve complete roof planes in the GLB and 12 whole-model views"
            ],
            model: {
              filename: "ahsan-manzil-lod3.glb",
              sha256: manifest.modelSha256,
              byteLength: glbBytes.length
            },
            renderManifest: {
              filename: "render-review-manifest.json",
              sha256: hash(manifestBytes),
              valid: manifest.valid,
              status: manifest.status,
              renderer: manifest.renderer,
              rendererVersion: manifest.rendererVersion,
              sceneBounds: manifest.sceneBounds
            },
            qa: {
              geometry: {filename:"geometry-qa-report.json",sha256:hash(geometryBytes),valid:geometry.valid,status:geometry.status,errors:geometry.errors || [],warnings:geometry.warnings || []},
              textures: {filename:"texture-qa-report.json",sha256:hash(textureBytes),valid:texture.valid,status:texture.status,errors:texture.errors || [],warnings:texture.warnings || []}
            },
            referencePack: {
              filename: "reference-pack/reference-pack.manifest.json",
              sha256: hash(referencePackBytes),
              verified: referencePack.verified,
              licensePolicy: referencePack.licensePolicy,
              sources: referencePack.sources.map((source) => ({
                id: source.id,
                imagePath: "reference-pack/" + source.imagePath,
                sha256: source.sha256,
                license: source.license,
                sourceUrl: source.url,
                downloadedUrl: source.downloadedUrl,
                downloadMode: source.downloadMode || "original",
                originalPublishedSha1: source.publishedSha1,
                viewRole: source.viewRole,
                verified: source.verified,
                verificationMethod: source.verificationMethod,
                cameraCalibration: source.viewAssessment?.cameraCalibration ?? "unknown"
              }))
            },
            views,
            visualReview: {
              contactSheet: "contact-sheet.png",
              status: "13-view render and hash validation passed; visual-fidelity acceptance remains pending. Roof tone uses a low-confidence aerial-photo estimate and the raised central dome-base platform adds a discrete roof section; texture/UV, fine roof segmentation, side/back framing and surveyed footprint remain unresolved.",
              findings: [
                "Side-by-side comparison with the licensed south/front reference showed the 39 m estimated stair base visually dominating the facade; reduced it to a 27 m (~48% of the provisional 55.8 m frontage) estimate, pending rectification.",
                "The original cumulative stair blocks concealed tread faces; generated one fixed-rise block per tread plus nosing detail, preserving the 16 m run and 6.4 m rise.",
                "Dome mid-body radii were enlarged to remove the visibly conical taper while retaining the 6.53 m body-height budget.",
                "Review lighting was raised and moved closer because the first contact sheet under-lit facade and roof detail.",
                "Wider/taller opening proportions reduce the excessive blank spandrel band; dimensions remain estimates pending rectified elevation.",
                "LOD3 adds small arch keystones/imposts and 16 dome meridian rib lines that follow the current profile samples.",
                "The review light rig was reduced and rebalanced to improve pink tone, window recess contrast, and stair tread definition.",
                "The front review camera uses a five-degree elevation to show stair treads; the dedicated RoofDeck plane is hidden only in this detail render and remains in the GLB/other 12 views. This is render framing, not a geometry-accuracy claim.",
                "Rangmahal-focused front plus 12 whole-model views preserve both facade-detail and full-footprint review coverage.",
                "A hash-pinned unrectified aerial photo shows large flat roof planes with multiple roof sections; a raised central dome-base platform was added using 14.0 m × 12.0 m [E] estimates, while other roof planes remain simplified parametric surfaces.",
                "The first roof-tint estimate #777168 still rendered too pale in the top-view comparison; the roof-deck proxy was darkened to #4A4740 using the same uncalibrated aerial reference. Roof texture/UV and precise section geometry remain unresolved.",
                "The prior focused-front render included an unrelated rear/left wing and clipped the facade edge. P3.3 now hides non-Rangmahal meshes for the front-detail view and fits that camera to the visible projected bounds; the regenerated front.png must be inspected before the framing change is accepted.",
                "The prior back and left/right orthographic views had too much whitespace for useful detail inspection. P3.3 now computes orthographic scale from each camera's projected mesh bounds; the regenerated images must be inspected before the framing change is accepted.",
                "The narrowed portico/stair landing, scaled dome profile, roof tone and roof-plane relationship are compared against four hash-pinned licensed views, including an unrectified aerial image; all dimensions remain estimates pending rectified elevation or independent survey.",
                "The facade remains highly stylized with pale, flat material appearance. Texture QA confirms zero images, zero textures, zero UV accessors, and all 21 primitives untextured; texture/facade fidelity is not verified.",
                "Several oblique views show a visually awkward stepped/elongated massing silhouette; it must be checked against permission-cleared multi-view references and a traced footprint before acceptance."
              ],
                "The plinth topology regression checks only mesh integrity for the provisional L-shaped footprint; the footprint itself remains estimated pending north-up tracing or survey.",
              residualRisks: [
                "Historical proportions and all [E]/[C]/[?] parameters require rectified elevations or measured survey.",
                "Geometry QA still reports topology warnings; texture QA reports no embedded texture images/atlas. Publication eligibility remains false."
              ],
              policy: "Hashes and QA metrics prove artifact identity and basic GLB integrity, not historical accuracy or release eligibility."
            }
          };
          const summaryText = JSON.stringify(summary, null, 2) + "\n";
          await writeFile(path.join(out, "P3.3-render-review-summary.json"), summaryText, {flag:"wx"});
          await writeFile("docs/heritage/p3.3-render-review-summary.json", summaryText, {flag:"w"});
          NODE

      - name: Copy visual review summary to the branch
        run: |
          cp artifacts/p3-3-render-set/contact-sheet.png docs/heritage/p3.3-render-contact-sheet.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/heritage/p3.3-render-review-summary.json docs/heritage/p3.3-render-contact-sheet.png docs/heritage/p3.3-topology-audit.md public/models/ahsan-manzil-lod1.glb public/models/ahsan-manzil-lod2.glb public/models/ahsan-manzil-lod3.glb public/models/ahsan-manzil.glb public/models/ahsan-manzil.manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(heritage): record P3.3 render evidence [skip ci]"
          fi
          # The model builder may also touch auxiliary generated metadata. Keep
          # the commit clean before rebasing it onto changes made during render.
          if [[ -n "$(git status --porcelain)" ]]; then
            git stash push --include-untracked -m "P3.3 transient build outputs before rebase"
          fi
          git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahsan-manzil-p3-3-render-review
          path: |
            artifacts/p3-3-render-set/
            artifacts/p3-3-qa/
            public/models/ahsan-manzil-lod1.glb
            public/models/ahsan-manzil-lod2.glb
            public/models/ahsan-manzil-lod3.glb
          if-no-files-found: error
          retention-days: 30
