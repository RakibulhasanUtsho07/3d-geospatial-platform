name: BRF-30 TUM2TWIN LOD3 catalog inventory

on:
  push:
    branches: [development]
    paths:
      - ".github/workflows/brf30-tum-lod3-catalog.yml"
      - "scripts/inspect_tum_lod3_catalog.py"
      - "tests/test_tum_lod3_catalog.py"
      - "docs/research/BRF-30-TUM-LOD3-CATALOG.md"
      - "benchmarks/building-reconstruction/brf-29-rights-and-building-mapping.json"
      - "benchmarks/building-reconstruction/brf-30-tum-lod3-catalog-snapshot.json"
  pull_request:
    branches: [development]
    paths:
      - ".github/workflows/brf30-tum-lod3-catalog.yml"
      - "scripts/inspect_tum_lod3_catalog.py"
      - "tests/test_tum_lod3_catalog.py"
      - "docs/research/BRF-30-TUM-LOD3-CATALOG.md"
      - "benchmarks/building-reconstruction/brf-29-rights-and-building-mapping.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brf30-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile scripts/inspect_tum_lod3_catalog.py tests/test_tum_lod3_catalog.py

      - name: Validate pinned catalog snapshot JSON
        run: python -c "import json; json.load(open('benchmarks/building-reconstruction/brf-30-tum-lod3-catalog-snapshot.json', encoding='utf-8'))"

      - name: Run catalog parser and fail-closed tests
        run: python -m unittest discover -s tests -p 'test_tum_lod3_catalog.py' -v

      - name: Inventory public TUM2TWIN CityGML LOD3 catalog metadata only
        run: python scripts/inspect_tum_lod3_catalog.py --output artifacts/brf30-tum-lod3-catalog/catalog.json

      - name: Upload pinned catalog inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brf30-tum-lod3-catalog-inventory
          path: artifacts/brf30-tum-lod3-catalog/catalog.json
          if-no-files-found: warn
          retention-days: 14
