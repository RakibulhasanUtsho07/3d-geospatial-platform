name: Ahsan Manzil real-media photogrammetry validation

on:
  push:
    branches:
      - validation/ahsan-manzil-real-media

permissions:
  contents: read

jobs:
  reconstruct-and-measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and measurement dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output/logs
          npm install --no-audit --no-fund 2>&1 | tee validation-output/logs/dependencies.log
          python -m pip install --upgrade pip
          python -m pip install numpy pillow open3d

      - name: Prepare workspace and download licensed source photographs
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$RUNNER_TEMP/ahsan-manzil-validation"
          mkdir -p "$WORKSPACE/uploads" validation-output/reference-images validation-output/logs
          printf '%s\n' "$WORKSPACE" > validation-output/workspace-path.txt
          cat > validation-output/reference-image-attribution.txt <<'ATTRIBUTION'
          Building: Ahsan Manzil (Pink Palace), Dhaka, Bangladesh
          Ahsan_Manzil_003.jpg through Ahsan_Manzil_006.jpg:
            Creator: Ranadipam Basu; License: CC BY-SA 3.0
            License URL: https://creativecommons.org/licenses/by-sa/3.0/
            Pages: https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_003.jpg
                   https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_004.jpg
                   https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_005.jpg
                   https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_006.jpg
          Ahsan_Manzil_Side_View.jpg:
            Creator: Parvezahmed; License: CC BY-SA 4.0
            License URL: https://creativecommons.org/licenses/by-sa/4.0/
            Page: https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_Side_View.jpg
          Ahsan_Manzil_(side).jpg:
            Creator: Mrpluto11; License: CC BY-SA 4.0
            License URL: https://creativecommons.org/licenses/by-sa/4.0/
            Page: https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_(side).jpg
          This artifact preserves the source originals and per-image attribution for this validation run.
          ATTRIBUTION
          while IFS='|' read -r source_id filename; do
            [ -n "$source_id" ] || continue
            url="https://commons.wikimedia.org/wiki/Special:FilePath/$filename"
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent '3D-Geospatial-Platform real-media validation/1.0' \
              "$url" --output "$WORKSPACE/uploads/$filename"
            test -s "$WORKSPACE/uploads/$filename"
            cp "$WORKSPACE/uploads/$filename" "validation-output/reference-images/$filename"
          done <<'FILES'
          ahsan003|Ahsan_Manzil_003.jpg
          ahsan004|Ahsan_Manzil_004.jpg
          ahsan005|Ahsan_Manzil_005.jpg
          ahsan006|Ahsan_Manzil_006.jpg
          ahsan007|Ahsan_Manzil_Side_View.jpg
          ahsan008|Ahsan_Manzil_(side).jpg
          FILES
          sha256sum "$WORKSPACE"/uploads/*.jpg > validation-output/reference-image-sha256.txt
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("validation-output/reference-images")
          rows = []
          for path in sorted(root.glob("*.jpg")):
              data = path.read_bytes()
              rows.append({"file": path.name, "bytes": len(data),
                           "sha256": hashlib.sha256(data).hexdigest()})
          pathlib.Path("validation-output/reference-images-manifest.json").write_text(
              json.dumps(rows, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(rows, indent=2))
          PY

      - name: Install COLMAP external reconstruction tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes colmap ffmpeg
          command -v colmap
          colmap -h > validation-output/logs/colmap-help.txt 2>&1 || true
          colmap -h 2>&1 | head -40

      - name: Validate analyzer syntax and run local quality-policy tests
        run: |
          python -m py_compile validation/analyze-real-glb.py scripts/create-sparse-poisson-mesh.py
          python - <<'PY'
          import open3d as o3d
          print("Open3D:", o3d.__version__)
          PY
          npm run test:colmap-worker
          npm run test:glb-geometry-qa

      - name: Run first-pass COLMAP reconstruction from real source photos
        id: first
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(cat validation-output/workspace-path.txt)"
          # COLMAP's Qt-linked binary otherwise attempts to connect to X11 on headless runners.
          export QT_QPA_PLATFORM=offscreen
          npm run build:building-from-media -- "$WORKSPACE" validation/ahsan-manzil-building-spec.json ahsan-unscaled \
            --source "ahsan003=uploads/Ahsan_Manzil_003.jpg" \
            --source "ahsan004=uploads/Ahsan_Manzil_004.jpg" \
            --source "ahsan005=uploads/Ahsan_Manzil_005.jpg" \
            --source "ahsan006=uploads/Ahsan_Manzil_006.jpg" \
            --source "ahsan007=uploads/Ahsan_Manzil_Side_View.jpg" \
            --source "ahsan008=uploads/Ahsan_Manzil_(side).jpg" \
            --licence "ahsan003=CC BY-SA 3.0" \
            --licence "ahsan004=CC BY-SA 3.0" \
            --licence "ahsan005=CC BY-SA 3.0" \
            --licence "ahsan006=CC BY-SA 3.0" \
            --licence "ahsan007=CC BY-SA 4.0" \
            --licence "ahsan008=CC BY-SA 4.0" \
            --author "ahsan003=Ranadipam Basu" \
            --author "ahsan004=Ranadipam Basu" \
            --author "ahsan005=Ranadipam Basu" \
            --author "ahsan006=Ranadipam Basu" \
            --author "ahsan007=Parvezahmed" \
            --author "ahsan008=Mrpluto11" \
            --attribution "ahsan003=Ranadipam Basu, CC BY-SA 3.0" \
            --attribution "ahsan004=Ranadipam Basu, CC BY-SA 3.0" \
            --attribution "ahsan005=Ranadipam Basu, CC BY-SA 3.0" \
            --attribution "ahsan006=Ranadipam Basu, CC BY-SA 3.0" \
            --attribution "ahsan007=Parvezahmed, CC BY-SA 4.0" \
            --attribution "ahsan008=Mrpluto11, CC BY-SA 4.0" \
            --source-url "ahsan003=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_003.jpg" \
            --source-url "ahsan004=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_004.jpg" \
            --source-url "ahsan005=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_005.jpg" \
            --source-url "ahsan006=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_006.jpg" \
            --source-url "ahsan007=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_Side_View.jpg" \
            --source-url "ahsan008=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_(side).jpg" \
            --kind "ahsan003=image" --kind "ahsan004=image" \
            --kind "ahsan005=image" --kind "ahsan006=image" \
            --kind "ahsan007=image" --kind "ahsan008=image" \
            --confirm-rights --strategy photogrammetry \
            --views "ahsan003,ahsan004,ahsan005,ahsan006,ahsan007,ahsan008" \
            --up-axis Y --confirm-same-building --confirm-overlap-reviewed --confirm-up-axis-reviewed \
            --quality LOW --colmap-path colmap --sparse-mesh-fallback --python python3 --reconstruction-timeout-ms 2400000 \
            2>&1 | tee validation-output/logs/first-pass.log

      - name: Capture raw reconstruction workspace diagnostics even when no mesh is produced
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(cat validation-output/workspace-path.txt)"
          JOB_ROOT="$WORKSPACE/.building-engine/jobs/ahsan-manzil-live-cv"
          mkdir -p validation-output/raw-workspace
          if [ -d "$JOB_ROOT" ]; then
            find "$JOB_ROOT" -type f -printf '%P | %s bytes\\n' | sort > validation-output/raw-workspace/file-list.txt
            cp -a "$JOB_ROOT/." validation-output/raw-workspace/
            find validation-output/raw-workspace -type f -name workflow-report.json -o -name report.json | while read -r file; do
              printf '\\n===== %s =====\\n' "$file"
              cat "$file"
            done > validation-output/raw-workspace/reports-summary.txt || true
          else
            printf 'Expected reconstruction job root was not created: %s\\n' "$JOB_ROOT" > validation-output/raw-workspace/file-list.txt
          fi
          colmap model_converter -h > validation-output/logs/model-converter-help.txt 2>&1 || true
          colmap poisson_mesher -h > validation-output/logs/poisson-mesher-help.txt 2>&1 || true
          colmap delaunay_mesher -h > validation-output/logs/delaunay-mesher-help.txt 2>&1 || true
          echo "Captured raw workspace diagnostics; no candidate is considered release-ready from this step."

      - name: Inspect unscaled candidate and create orthographic previews
        id: measure
        if: steps.first.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(cat validation-output/workspace-path.txt)"
          MODEL="$WORKSPACE/.building-engine/jobs/ahsan-manzil-live-cv/ahsan-unscaled-workflow/model.glb"
          REPORT="$WORKSPACE/.building-engine/jobs/ahsan-manzil-live-cv/ahsan-unscaled-workflow/workflow-report.json"
          test -s "$MODEL"
          mkdir -p validation-output/unscaled
          cp "$MODEL" validation-output/unscaled/model.glb
          cp "$REPORT" validation-output/unscaled/workflow-report.json
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path(pathlib.Path("validation-output/workspace-path.txt").read_text().strip())
          report_path = root / ".building-engine/jobs/ahsan-manzil-live-cv/ahsan-unscaled-workflow/workflow-report.json"
          report = json.loads(report_path.read_text())
          worker_path = report.get("output", {}).get("reportPath")
          if worker_path:
              source = root / worker_path
              if source.is_file():
                  shutil.copy2(source, "validation-output/unscaled/colmap-worker-report.json")
          PY
          python validation/analyze-real-glb.py --mode measure \
            --glb validation-output/unscaled/model.glb \
            --output validation-output/unscaled/measurements.json \
            --render-dir validation-output/unscaled/previews

      - name: Run second-pass reconstruction with length-based scale calibration
        id: scaled
        if: steps.measure.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(cat validation-output/workspace-path.txt)"
          # Keep the actual reconstruction worker headless on GitHub-hosted Linux.
          export QT_QPA_PLATFORM=offscreen
          RAW_LONG="$(python -c 'import json; print(format(json.load(open("validation-output/unscaled/measurements.json"))["longAxisModelUnits"], ".12g"))')"
          python - "$RAW_LONG" <<'PY'
          import sys
          value = float(sys.argv[1])
          if not (value > 0 and value < 1e9):
              raise SystemExit("unscaled long-axis extent is invalid: " + repr(value))
          print("Unscaled longest horizontal principal extent:", value, "model units")
          PY
          npm run build:building-from-media -- "$WORKSPACE" validation/ahsan-manzil-building-spec.json ahsan-scaled \
            --source "ahsan003=uploads/Ahsan_Manzil_003.jpg" \
            --source "ahsan004=uploads/Ahsan_Manzil_004.jpg" \
            --source "ahsan005=uploads/Ahsan_Manzil_005.jpg" \
            --source "ahsan006=uploads/Ahsan_Manzil_006.jpg" \
            --source "ahsan007=uploads/Ahsan_Manzil_Side_View.jpg" \
            --source "ahsan008=uploads/Ahsan_Manzil_(side).jpg" \
            --licence "ahsan003=CC BY-SA 3.0" \
            --licence "ahsan004=CC BY-SA 3.0" \
            --licence "ahsan005=CC BY-SA 3.0" \
            --licence "ahsan006=CC BY-SA 3.0" \
            --licence "ahsan007=CC BY-SA 4.0" \
            --licence "ahsan008=CC BY-SA 4.0" \
            --author "ahsan003=Ranadipam Basu" \
            --author "ahsan004=Ranadipam Basu" \
            --author "ahsan005=Ranadipam Basu" \
            --author "ahsan006=Ranadipam Basu" \
            --author "ahsan007=Parvezahmed" \
            --author "ahsan008=Mrpluto11" \
            --attribution "ahsan003=Ranadipam Basu, CC BY-SA 3.0" \
            --attribution "ahsan004=Ranadipam Basu, CC BY-SA 3.0" \
            --attribution "ahsan005=Ranadipam Basu, CC BY-SA 3.0" \
            --attribution "ahsan006=Ranadipam Basu, CC BY-SA 3.0" \
            --attribution "ahsan007=Parvezahmed, CC BY-SA 4.0" \
            --attribution "ahsan008=Mrpluto11, CC BY-SA 4.0" \
            --source-url "ahsan003=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_003.jpg" \
            --source-url "ahsan004=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_004.jpg" \
            --source-url "ahsan005=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_005.jpg" \
            --source-url "ahsan006=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_006.jpg" \
            --source-url "ahsan007=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_Side_View.jpg" \
            --source-url "ahsan008=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_(side).jpg" \
            --kind "ahsan003=image" --kind "ahsan004=image" \
            --kind "ahsan005=image" --kind "ahsan006=image" \
            --kind "ahsan007=image" --kind "ahsan008=image" \
            --confirm-rights --strategy photogrammetry \
            --views "ahsan003,ahsan004,ahsan005,ahsan006,ahsan007,ahsan008" \
            --up-axis Y --confirm-same-building --confirm-overlap-reviewed --confirm-up-axis-reviewed \
            --quality LOW --colmap-path colmap --sparse-mesh-fallback --python python3 --reconstruction-timeout-ms 2400000 \
            --model-distance "$RAW_LONG" --real-distance-m 125.4 \
            2>&1 | tee validation-output/logs/scaled-pass.log

      - name: Compare dimensions and create calibrated orthographic previews
        id: compare
        if: steps.scaled.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(cat validation-output/workspace-path.txt)"
          MODEL="$WORKSPACE/.building-engine/jobs/ahsan-manzil-live-cv/ahsan-scaled-workflow/model.glb"
          REPORT="$WORKSPACE/.building-engine/jobs/ahsan-manzil-live-cv/ahsan-scaled-workflow/workflow-report.json"
          test -s "$MODEL"
          mkdir -p validation-output/calibrated
          cp "$MODEL" validation-output/calibrated/model.glb
          cp "$REPORT" validation-output/calibrated/workflow-report.json
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path(pathlib.Path("validation-output/workspace-path.txt").read_text().strip())
          report_path = root / ".building-engine/jobs/ahsan-manzil-live-cv/ahsan-scaled-workflow/workflow-report.json"
          report = json.loads(report_path.read_text())
          worker_path = report.get("output", {}).get("reportPath")
          if worker_path:
              source = root / worker_path
              if source.is_file():
                  shutil.copy2(source, "validation-output/calibrated/colmap-worker-report.json")
          PY
          python validation/analyze-real-glb.py --mode compare \
            --glb validation-output/calibrated/model.glb \
            --output validation-output/dimension-comparison.json \
            --render-dir validation-output/calibrated/previews \
            --reference-length-m 125.4 --reference-depth-m 28.75 --reference-height-m 27.13 \
            --depth-tolerance-percent 20 --height-tolerance-percent 20

      - name: Summarize real-media validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f validation-output/dimension-comparison.json ]; then
            python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("validation-output/dimension-comparison.json").read_text())
          result = data.get("dimensionComparison", {})
          print("DIMENSION GATE:", result.get("dimensionGate", "unknown"))
          print(json.dumps(result, indent=2))
          if result.get("dimensionGate") != "pass":
              print("::error title=Real media validation::Depth/vertical dimensions are outside the exploratory tolerance or the comparison report is incomplete.")
              raise SystemExit(1)
          else:
              print("::notice title=Real media validation::Independent depth and vertical checks are within exploratory tolerance; visual review and WGS84 registration remain required.")
          PY
          elif [ -f validation-output/unscaled/measurements.json ]; then
            echo "::warning title=Real media validation::First-pass real-media candidate exists, but calibrated run/comparison did not complete. Check logs/reports."
          else
            echo "::error title=Real media validation::No reconstruction GLB was produced. Check the first-pass log and workflow reports."
            exit 1
          fi

      - name: Upload source photos, models and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahsan-manzil-real-media-validation
          path: validation-output/
          if-no-files-found: warn
          retention-days: 7
