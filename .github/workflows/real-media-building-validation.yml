name: Ahsan Manzil real-media photogrammetry validation

on:
  push:
    branches:
      - validation/ahsan-manzil-real-media

permissions:
  contents: read

jobs:
  reconstruct-and-measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and measurement dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output/logs
          npm install --no-audit --no-fund 2>&1 | tee validation-output/logs/dependencies.log
          python -m pip install --upgrade pip
          python -m pip install numpy pillow open3d

      - name: Prepare workspace and download licensed source photographs
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$RUNNER_TEMP/ahsan-manzil-validation"
          mkdir -p "$WORKSPACE/uploads" validation-output/reference-images validation-output/logs
          printf '%s\n' "$WORKSPACE" > validation-output/workspace-path.txt
          cat > validation-output/reference-image-attribution.txt <<'ATTRIBUTION'
          Building: Ahsan Manzil (Pink Palace), Dhaka, Bangladesh
          Same-photographer controlled view set: Ahsan Manzil view 02–07.jpg
          Photographer: Saeed Ahmad; Date: 30 September 2016 (Commons metadata)
          License: Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)
          License URL: https://creativecommons.org/licenses/by-sa/4.0/
          Source pages:
          https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_02.jpg
          https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_03.jpg
          https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_04.jpg
          https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_05.jpg
          https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_06.jpg
          https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_07.jpg
          View coverage observed from thumbnails:
          view 02 and 06: dome/tower-focused; view 03 and 07: broad front/corner views;
          view 04: long side-wing; view 05: broad facade with oblique angle.
          Commons reports the same camera-location coordinate for all six images. This is
          not treated as surveyed camera-pose evidence or a reliable translation baseline.
          The set consists of still photographs, not a continuous walk-around sequence.
          ATTRIBUTION
          while IFS='|' read -r source_id filename; do
            [ -n "$source_id" ] || continue
            url="https://commons.wikimedia.org/wiki/Special:FilePath/$filename"
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent '3D-Geospatial-Platform real-media validation/1.0' \
              "$url" --output "$WORKSPACE/uploads/$filename"
            test -s "$WORKSPACE/uploads/$filename"
            cp "$WORKSPACE/uploads/$filename" "validation-output/reference-images/$filename"
          done <<'FILES'
          saeed02|Ahsan_Manzil_view_02.jpg
          saeed03|Ahsan_Manzil_view_03.jpg
          saeed04|Ahsan_Manzil_view_04.jpg
          saeed05|Ahsan_Manzil_view_05.jpg
          saeed06|Ahsan_Manzil_view_06.jpg
          saeed07|Ahsan_Manzil_view_07.jpg
          FILES
          sha256sum "$WORKSPACE"/uploads/*.jpg > validation-output/reference-image-sha256.txt
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("validation-output/reference-images")
          rows = []
          for path in sorted(root.glob("*.jpg")):
              data = path.read_bytes()
              rows.append({"file": path.name, "bytes": len(data),
                           "sha256": hashlib.sha256(data).hexdigest()})
          pathlib.Path("validation-output/reference-images-manifest.json").write_text(
              json.dumps(rows, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(rows, indent=2))
          PY

      - name: Install COLMAP external reconstruction tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes colmap ffmpeg
          command -v colmap
          colmap -h > validation-output/logs/colmap-help.txt 2>&1 || true
          colmap -h 2>&1 | head -40

      - name: Validate analyzer syntax and run local quality-policy tests
        run: |
          python -m py_compile validation/analyze-real-glb.py scripts/create-sparse-poisson-mesh.py validation/evaluate-real-validation.py validation/build-review-contact-sheet.py tests/real-glb-analyzer.test.py
          python tests/real-glb-analyzer.test.py
          python - <<'PY'
          import open3d as o3d
          print("Open3D:", o3d.__version__)
          PY
          npm run test:colmap-worker
          npm run test:glb-geometry-qa

      - name: Run first-pass COLMAP reconstruction from real source photos
        id: first
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(cat validation-output/workspace-path.txt)"
          # COLMAP's Qt-linked binary otherwise attempts to connect to X11 on headless runners.
          export QT_QPA_PLATFORM=offscreen
          # Controlled follow-up: use six same-photographer CC BY-SA 4.0 views.
          # They cover front, oblique corner, long wing and dome details, but are not
          # a continuous walk-around sequence; pose spread and dimensional gates remain mandatory.
          npm run build:building-from-media -- "$WORKSPACE" validation/ahsan-manzil-building-spec.json ahsan-unscaled \
            --source "saeed02=uploads/Ahsan_Manzil_view_02.jpg" \
            --source "saeed03=uploads/Ahsan_Manzil_view_03.jpg" \
            --source "saeed04=uploads/Ahsan_Manzil_view_04.jpg" \
            --source "saeed05=uploads/Ahsan_Manzil_view_05.jpg" \
            --source "saeed06=uploads/Ahsan_Manzil_view_06.jpg" \
            --source "saeed07=uploads/Ahsan_Manzil_view_07.jpg" \
            --licence "saeed02=CC BY-SA 4.0" \
            --licence "saeed03=CC BY-SA 4.0" \
            --licence "saeed04=CC BY-SA 4.0" \
            --licence "saeed05=CC BY-SA 4.0" \
            --licence "saeed06=CC BY-SA 4.0" \
            --licence "saeed07=CC BY-SA 4.0" \
            --author "saeed02=Saeed Ahmad" \
            --author "saeed03=Saeed Ahmad" \
            --author "saeed04=Saeed Ahmad" \
            --author "saeed05=Saeed Ahmad" \
            --author "saeed06=Saeed Ahmad" \
            --author "saeed07=Saeed Ahmad" \
            --attribution "saeed02=Saeed Ahmad, CC BY-SA 4.0" \
            --attribution "saeed03=Saeed Ahmad, CC BY-SA 4.0" \
            --attribution "saeed04=Saeed Ahmad, CC BY-SA 4.0" \
            --attribution "saeed05=Saeed Ahmad, CC BY-SA 4.0" \
            --attribution "saeed06=Saeed Ahmad, CC BY-SA 4.0" \
            --attribution "saeed07=Saeed Ahmad, CC BY-SA 4.0" \
            --source-url "saeed02=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_02.jpg" \
            --source-url "saeed03=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_03.jpg" \
            --source-url "saeed04=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_04.jpg" \
            --source-url "saeed05=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_05.jpg" \
            --source-url "saeed06=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_06.jpg" \
            --source-url "saeed07=https://commons.wikimedia.org/wiki/File:Ahsan_Manzil_view_07.jpg" \
            --kind "saeed02=image" \
            --kind "saeed03=image" \
            --kind "saeed04=image" \
            --kind "saeed05=image" \
            --kind "saeed06=image" \
            --kind "saeed07=image" \
            --confirm-rights --strategy photogrammetry \
            --views "saeed02,saeed03,saeed04,saeed05,saeed06,saeed07" \
            --up-axis Y --confirm-same-building --confirm-overlap-reviewed --confirm-up-axis-reviewed \
            --quality LOW --colmap-path colmap --sparse-mesh-fallback --python python3 --reconstruction-timeout-ms 2400000 \
            2>&1 | tee validation-output/logs/first-pass.log

      - name: Capture raw reconstruction workspace diagnostics even when no mesh is produced
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(cat validation-output/workspace-path.txt)"
          JOB_ROOT="$WORKSPACE/.building-engine/jobs/ahsan-manzil-live-cv"
          mkdir -p validation-output/raw-workspace
          if [ -d "$JOB_ROOT" ]; then
            find "$JOB_ROOT" -type f -printf '%P | %s bytes\\n' | sort > validation-output/raw-workspace/file-list.txt
            cp -a "$JOB_ROOT/." validation-output/raw-workspace/
            find validation-output/raw-workspace -type f -name workflow-report.json -o -name report.json | while read -r file; do
              printf '\\n===== %s =====\\n' "$file"
              cat "$file"
            done > validation-output/raw-workspace/reports-summary.txt || true
          else
            printf 'Expected reconstruction job root was not created: %s\\n' "$JOB_ROOT" > validation-output/raw-workspace/file-list.txt
          fi
          colmap model_converter -h > validation-output/logs/model-converter-help.txt 2>&1 || true
          colmap poisson_mesher -h > validation-output/logs/poisson-mesher-help.txt 2>&1 || true
          colmap delaunay_mesher -h > validation-output/logs/delaunay-mesher-help.txt 2>&1 || true
          echo "Captured raw workspace diagnostics; no candidate is considered release-ready from this step."

      - name: Inspect unscaled candidate and create orthographic previews
        id: measure
        if: steps.first.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(cat validation-output/workspace-path.txt)"
          MODEL="$WORKSPACE/.building-engine/jobs/ahsan-manzil-live-cv/ahsan-unscaled-workflow/model.glb"
          REPORT="$WORKSPACE/.building-engine/jobs/ahsan-manzil-live-cv/ahsan-unscaled-workflow/workflow-report.json"
          test -s "$MODEL"
          mkdir -p validation-output/unscaled
          cp "$MODEL" validation-output/unscaled/model.glb
          cp "$REPORT" validation-output/unscaled/workflow-report.json
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path(pathlib.Path("validation-output/workspace-path.txt").read_text().strip())
          report_path = root / ".building-engine/jobs/ahsan-manzil-live-cv/ahsan-unscaled-workflow/workflow-report.json"
          report = json.loads(report_path.read_text())
          worker_path = report.get("output", {}).get("reportPath")
          if worker_path:
              source = root / worker_path
              if source.is_file():
                  shutil.copy2(source, "validation-output/unscaled/colmap-worker-report.json")
          PY
          python validation/analyze-real-glb.py --mode measure \
            --glb validation-output/unscaled/model.glb \
            --output validation-output/unscaled/measurements.json \
            --render-dir validation-output/unscaled/previews

      - name: Calibrate the existing GLB to the published length reference
        id: scaled
        if: steps.measure.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output/calibrated
          python -m py_compile validation/analyze-real-glb.py
          python validation/analyze-real-glb.py --mode calibrate \
            --glb validation-output/unscaled/model.glb \
            --output validation-output/calibrated/model.glb \
            --report validation-output/calibrated/calibration-report.json \
            --reference-length-m 125.4
          cp validation-output/unscaled/workflow-report.json validation-output/calibrated/workflow-report.json
          if [ -f validation-output/unscaled/colmap-worker-report.json ]; then
            cp validation-output/unscaled/colmap-worker-report.json validation-output/calibrated/colmap-worker-report.json
          fi

      - name: Compare dimensions and create calibrated orthographic previews
        id: compare
        if: steps.scaled.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          MODEL="validation-output/calibrated/model.glb"
          test -s "$MODEL"
          test -s validation-output/calibrated/calibration-report.json
          python validation/analyze-real-glb.py --mode compare \
            --glb validation-output/calibrated/model.glb \
            --output validation-output/dimension-comparison.json \
            --render-dir validation-output/calibrated/previews \
            --reference-length-m 125.4 --reference-depth-m 28.75 --reference-height-m 27.13 \
            --depth-tolerance-percent 20 --height-tolerance-percent 20
          python validation/build-review-contact-sheet.py \
            --references validation-output/reference-images \
            --previews validation-output/calibrated/previews \
            --output validation-output/review-contact-sheet.png

      - name: Summarize real-media validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f validation-output/dimension-comparison.json ]; then
            if [ ! -s validation-output/calibrated/colmap-worker-report.json ]; then
              echo "::error title=Real media validation::COLMAP worker report is missing; image-coverage gate cannot be evaluated."
              exit 1
            fi
            python validation/evaluate-real-validation.py \
              --dimensions validation-output/dimension-comparison.json \
              --worker-report validation-output/calibrated/colmap-worker-report.json \
              --calibration-report validation-output/calibrated/calibration-report.json \
              --output validation-output/overall-validation.json \
              --minimum-registered-ratio 0.75 \
              --minimum-registered-images 6 \
              --minimum-view-direction-spread-degrees 20
          elif [ -f validation-output/unscaled/measurements.json ]; then
            echo "::error title=Real media validation::A candidate exists but calibration/dimension comparison did not complete; this run is incomplete."
            exit 1
          else
            echo "::error title=Real media validation::No reconstruction GLB was produced. Check the first-pass log and workflow reports."
            exit 1
          fi

      - name: Upload source photos, models and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahsan-manzil-real-media-validation
          path: validation-output/
          if-no-files-found: warn
          retention-days: 7
