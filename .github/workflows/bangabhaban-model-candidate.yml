name: Bangabhaban model candidate
on:
  push:
    branches:
      - rakibul-hasan
    paths:
      - ".github/workflows/bangabhaban-model-candidate.yml"
      - "src/core/building-generation/building-spec.mjs"
      - "src/core/building-generation/procedural-glb.mjs"
      - "scripts/build-bangabhaban-model-candidate.mjs"
      - "data/heritage/bangabhaban-building-spec.json"
      - "tests/bangabhaban-generation.test.mjs"
permissions:
  contents: write
concurrency:
  group: bangabhaban-model-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate model through the repository engine
        run: node scripts/build-bangabhaban-model-candidate.mjs
      - name: Validate model and candidate gates
        run: node --test tests/bangabhaban-generation.test.mjs tests/glb-geometry-qa.test.mjs
      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: bangabhaban-procedural-candidate
          path: |
            data/heritage/generated/bangabhaban-candidate.glb
            data/heritage/generated/bangabhaban-candidate.report.json
          if-no-files-found: error
          retention-days: 30
      - name: Save generated candidate into this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heritage/generated/bangabhaban-candidate.glb data/heritage/generated/bangabhaban-candidate.report.json
          if git diff --cached --quiet; then
            echo "Candidate assets are unchanged."
            exit 0
          fi
          git commit -m "build: generate Bangabhaban candidate GLB"
          git push origin "HEAD:${GITHUB_REF_NAME}"
