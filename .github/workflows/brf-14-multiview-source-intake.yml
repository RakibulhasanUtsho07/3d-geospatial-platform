name: BRF-14 multi-view source-byte intake

on:
  pull_request:
    branches:
      - development
    paths:
      - ".github/workflows/brf-14-multiview-source-intake.yml"
      - "benchmarks/building-reconstruction/brf-14-multiview-source.json"
      - "scripts/verify-brf14-multiview-source.mjs"
      - "tests/brf14-multiview-source-intake.test.mjs"
      - "scripts/prepare_brf14_multiview_review.py"
      - "tests/test_prepare_brf14_multiview_review.py"
      - "docs/research/BRF-14-MULTIVIEW-CANDIDATE-SAMPLE.md"
      - "docs/research/BRF-10-SURVEY-BACKED-BENCHMARK-READINESS.md"
      - "scripts/analyze_brf14_multiview_overlap.py"
      - "tests/test_analyze_brf14_multiview_overlap.py"
      - "docs/research/BRF-21-PAIRWISE-IMAGE-OVERLAP.md"
      - "scripts/brf21_human_review.py"
      - "tests/test_brf21_human_review.py"
      - "docs/research/BRF-22-HUMAN-REVIEW-DECISION-CONTRACT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brf-14-multiview-source-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-multi-view-images:
    name: Download and verify 16 pinned candidate views
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned image-review dependency
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6" "opencv-python-headless==4.11.0.86" "Pillow==11.3.0"

      - name: Test fail-closed multi-view byte verifier
        run: node --test tests/brf14-multiview-source-intake.test.mjs

      - name: Validate verifier CLI
        run: node scripts/verify-brf14-multiview-source.mjs --help

      - name: Test human-review packet and fail-closed gates
        run: python -m unittest discover -s tests -p "test_prepare_brf14_multiview_review.py"

      - name: Test pairwise image-overlap triage and fail-closed gates
        run: python -m unittest discover -s tests -p "test_analyze_brf14_multiview_overlap.py"

      - name: Validate overlap analyzer CLI
        run: python scripts/analyze_brf14_multiview_overlap.py --help

      - name: Test BRF-22 hash-bound human review decision contract
        run: python -m unittest discover -s tests -p "test_brf21_human_review.py"

      - name: Validate BRF-22 human-review CLI
        run: python scripts/brf21_human_review.py --help

      - name: Download selected images to ephemeral runner storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brf14/images" artifacts/brf-14
          while IFS=$'\t' read -r filename url; do
            [[ "$filename" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "Unsafe filename in manifest"; exit 1; }
            [[ "$url" == https://huggingface.co/datasets/Matt1up/drone-building-scans/resolve/main/flat-roof/images/* ]] || { echo "Source URL is not allowlisted"; exit 1; }
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 180 \
              "$url" --output "$RUNNER_TEMP/brf14/images/$filename"
          done < <(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const m = JSON.parse(readFileSync("benchmarks/building-reconstruction/brf-14-multiview-source.json", "utf8"));
            for (const v of m.views) console.log(v.filename + "\t" + v.sourceUrl);
          ')

      - name: Verify actual bytes and source-frame declarations
        run: |
          node scripts/verify-brf14-multiview-source.mjs \
            --manifest benchmarks/building-reconstruction/brf-14-multiview-source.json \
            --asset-root "$RUNNER_TEMP/brf14/images" \
            --report artifacts/brf-14/multiview-source-byte-verification.json

      - name: Generate hash-bound contact sheet and camera-angle coverage plot
        run: |
          python scripts/prepare_brf14_multiview_review.py \
            --manifest benchmarks/building-reconstruction/brf-14-multiview-source.json \
            --asset-root "$RUNNER_TEMP/brf14/images" \
            --verification-report artifacts/brf-14/multiview-source-byte-verification.json \
            --output-dir artifacts/brf-14

      - name: Analyze pairwise feature overlap for human triage
        run: |
          python scripts/analyze_brf14_multiview_overlap.py \
            --manifest benchmarks/building-reconstruction/brf-14-multiview-source.json \
            --asset-root "$RUNNER_TEMP/brf14/images" \
            --verification-report artifacts/brf-14/multiview-source-byte-verification.json \
            --output-dir artifacts/brf-14

      - name: Stage the exact pinned BRF-14 manifest beside derived review artifacts
        run: cp benchmarks/building-reconstruction/brf-14-multiview-source.json artifacts/brf-14/brf-14-multiview-source.json

      - name: Generate a blank human-review decision form from verified evidence
        run: |
          python scripts/brf21_human_review.py template \\
            --artifact-root artifacts/brf-14 \\
            --output multiview-human-review-decision-template.json

      - name: Upload derived review artifacts and blank template only (never raw images)
        uses: actions/upload-artifact@v4
        with:
          name: brf-20-multiview-human-review-packet
          path: |
            artifacts/brf-14/brf-14-multiview-source.json
            artifacts/brf-14/multiview-source-byte-verification.json
            artifacts/brf-14/multiview-contact-sheet.png
            artifacts/brf-14/camera-angle-coverage.png
            artifacts/brf-14/multiview-review-manifest.json
            artifacts/brf-14/pairwise-overlap-graph.png
            artifacts/brf-14/pairwise-overlap-report.json
            artifacts/brf-14/multiview-human-review-decision-template.json
          if-no-files-found: error
          retention-days: 7
