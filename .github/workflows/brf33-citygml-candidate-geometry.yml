name: BRF-33 pinned CityGML full-geometry inspection

on:
  push:
    branches: [development]
    paths:
      - ".github/workflows/brf33-citygml-candidate-geometry.yml"
      - "scripts/inspect_tum_citygml_candidate.py"
      - "tests/test_tum_citygml_candidate.py"
      - "docs/research/BRF-33-CITYGML-CANDIDATE-GEOMETRY.md"
      - "benchmarks/building-reconstruction/brf-30-tum-lod3-catalog-snapshot.json"
      - "benchmarks/building-reconstruction/brf-31-citygml-envelope-screening.json"
      - "benchmarks/building-reconstruction/brf-33-citygml-candidate-geometry.json"
  pull_request:
    branches: [development]
    paths:
      - ".github/workflows/brf33-citygml-candidate-geometry.yml"
      - "scripts/inspect_tum_citygml_candidate.py"
      - "tests/test_tum_citygml_candidate.py"
      - "docs/research/BRF-33-CITYGML-CANDIDATE-GEOMETRY.md"
      - "benchmarks/building-reconstruction/brf-30-tum-lod3-catalog-snapshot.json"
      - "benchmarks/building-reconstruction/brf-31-citygml-envelope-screening.json"
      - "benchmarks/building-reconstruction/brf-33-citygml-candidate-geometry.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brf33-citygml-full-geometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-one-pinned-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile scripts/inspect_tum_citygml_candidate.py tests/test_tum_citygml_candidate.py

      - name: Test whole-object verification and CityGML geometry parser
        run: python -m unittest discover -s tests -p 'test_tum_citygml_candidate.py' -v

      - name: Validate persisted candidate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("benchmarks/building-reconstruction/brf-33-citygml-candidate-geometry.json").read_text(encoding="utf-8"))
          if report.get("status") != "full-object-hash-verified-xml-valid-geometry-extracted":
              raise SystemExit("Persisted BRF-33 result is not in the verified state.")
          if report["byteVerification"]["actualSha256"] != report["source"]["lfsExpectedSha256"]:
              raise SystemExit("Persisted candidate hash does not match the pinned Git LFS hash.")
          if report["byteVerification"]["actualBytes"] != report["source"]["lfsExpectedBytes"]:
              raise SystemExit("Persisted candidate size does not match the pinned Git LFS size.")
          if report["geometry"]["coordinateTupleCount3D"] < 1 or not report["geometry"]["fullXmlDocumentValidated"]:
              raise SystemExit("Persisted full geometry evidence is incomplete.")
          if report["sameBuildingVerified"] is not False or any(report["releaseFlags"].values()):
              raise SystemExit("Persisted evidence must not promote building identity or release flags.")
          PY

      - name: Download, verify, and inspect only the pinned 51 MB candidate
        run: python scripts/inspect_tum_citygml_candidate.py --snapshot benchmarks/building-reconstruction/brf-30-tum-lod3-catalog-snapshot.json --envelope-report benchmarks/building-reconstruction/brf-31-citygml-envelope-screening.json --output artifacts/brf33-citygml-candidate/report.json

      - name: Require verified whole-object hash and parsed geometry while keeping release blocked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/brf33-citygml-candidate/report.json").read_text(encoding="utf-8"))
          if report.get("status") != "full-object-hash-verified-xml-valid-geometry-extracted":
              raise SystemExit("Candidate inspection was blocked: " + str(report.get("reason")))
          if report["byteVerification"]["actualSha256"] != report["source"]["lfsExpectedSha256"]:
              raise SystemExit("Whole-object SHA-256 does not match the pinned LFS object.")
          if report["byteVerification"]["actualBytes"] != report["source"]["lfsExpectedBytes"]:
              raise SystemExit("Whole-object byte size does not match the pinned LFS object.")
          geometry = report.get("geometry", {})
          if not geometry.get("fullXmlDocumentValidated") or geometry.get("coordinateTupleCount3D", 0) < 1:
              raise SystemExit("Full CityGML XML or geometry extraction was not validated.")
          if report.get("sameBuildingVerified") is not False:
              raise SystemExit("Candidate must remain unselected until cross-modal evidence is reviewed.")
          if any(report["releaseFlags"].values()):
              raise SystemExit("A release flag was incorrectly enabled.")
          print(json.dumps({
              "status": report["status"],
              "candidate": report["source"]["path"],
              "bytes": report["byteVerification"]["actualBytes"],
              "sha256": report["byteVerification"]["actualSha256"],
              "coordinateTuples": geometry["coordinateTupleCount"],
              "srsNames": geometry["srsNamesObserved"],
              "bounds": geometry["coordinateBounds"],
              "releaseFlags": report["releaseFlags"],
          }, indent=2))
          PY

      - name: Compare live extraction with persisted evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("artifacts/brf33-citygml-candidate/report.json").read_text(encoding="utf-8"))
          expected = json.loads(Path("benchmarks/building-reconstruction/brf-33-citygml-candidate-geometry.json").read_text(encoding="utf-8"))
          checks = {
              "status": (actual.get("status"), expected.get("status")),
              "source.sha256": (actual["byteVerification"]["actualSha256"], expected["byteVerification"]["actualSha256"]),
              "source.bytes": (actual["byteVerification"]["actualBytes"], expected["byteVerification"]["actualBytes"]),
              "geometry.crs": (actual["geometry"]["srsNamesObserved"], expected["geometry"]["srsNamesObserved"]),
              "geometry.ids": (actual["geometry"]["buildingGmlIds"], expected["geometry"]["buildingGmlIds"]),
              "geometry.count3d": (actual["geometry"]["coordinateTupleCount3D"], expected["geometry"]["coordinateTupleCount3D"]),
              "geometry.counts": (actual["geometry"]["geometryCounts"], expected["geometry"]["geometryCounts"]),
              "geometry.bounds": (actual["geometry"]["coordinateBounds"], expected["geometry"]["coordinateBounds"]),
          }
          mismatches = {key: values for key, values in checks.items() if values[0] != values[1]}
          if mismatches:
              raise SystemExit("Live extraction differs from persisted pinned evidence: " + json.dumps(mismatches, sort_keys=True))
          print("Live whole-object and geometry result matches the persisted BRF-33 evidence record.")
          PY

      - name: Upload non-sensitive candidate geometry summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brf33-citygml-candidate-geometry-summary
          path: artifacts/brf33-citygml-candidate/report.json
          if-no-files-found: warn
          retention-days: 14
