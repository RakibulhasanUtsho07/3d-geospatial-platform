name: CI

on:
  push:
    branches:
      - main
      - dev
      - rakibul-hasan
      - feat/generated-building-model-layer
      - feat/building-generation-core
      - feat/building-media-intake
      - feat/colmap-reconstruction-worker
      - feat/single-image-3d-worker
      - feat/media-source-review-flow
      - feat/multiview-image-quality-preflight
      - feat/generated-model-geometry-qa
      - feat/unified-media-to-3d-cli
      - feat/building-ground-control-registration
      - feat/per-view-architectural-sketches
      - feat/mask-guided-building-sketches
      - feat/multi-view-wireframe-registration
      - feat/wireframe-qa-repair-passes
      - feat/texture-projection-validation
      - feat/texture-bake-readiness-qa
      - feat/texture-atlas-baking
      - feat/glb-texture-binding-qa
      - feat/glb-uv-seam-review
      - feat/blender-render-review-views
      - feat/render-reference-comparison-review
      - feat/render-review-correction-tasks
      - feat/render-correction-verification
      - feat/building-release-readiness-gate
      - feat/building-review-package
      - feat/building-review-package-integrity-v2
      - feat/building-review-package-signatures
      - feat/building-accuracy-benchmark
      - feat/render-image-similarity-diagnostics
      - feat/evidence-linked-image-diagnostics
      - feat/texture-projection-validation
  pull_request:
    branches:
      - main
      - dev
      - rakibul-hasan
      - feat/building-review-package-signatures
      - feat/building-accuracy-benchmark
      - feat/render-image-similarity-diagnostics
      - feat/evidence-linked-image-diagnostics

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and reconcile lockfile
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Test generated model input policy
        run: npm run test:generated-model-policy

      - name: Test GLB geometry quality report and invalid mesh rejection
        run: npm run test:glb-geometry-qa

      - name: Test BuildingSpec validation and procedural GLB generation
        run: npm run test:building-generation

      - name: Test local media intake and bounded video frame extraction
        run: npm run test:building-media

      - name: Test media source rights review and BuildingSpec preparation
        run: npm run test:building-source-workflow

      - name: Test ground-control WGS84 registration math
        run: npm run test:ground-control-registration

      - name: Test end-to-end media-to-model orchestration
        run: npm run test:media-to-model-workflow

      - name: Test image quality preflight and near-duplicate view detection
        run: npm run test:image-quality-preflight

      - name: Test overlapping image tile planning and coordinate merging
        run: npm run test:image-tile-analysis

      - name: Test per-view architectural sketch preparation
        run: npm run test:architectural-sketch-preparation
      - name: Test mask-guided building sketch preparation
        run: npm run test:mask-guided-building-sketches

      - name: Test bounded wireframe QA and safe repair passes
        run: npm run test:wireframe-qa-repair-passes

      - name: Test reviewed wireframe to mesh candidate
        run: npm run test:wireframe-to-mesh

      - name: Test evidence-gated mesh surface review
        run: npm run test:mesh-surface-review

      - name: Test texture projection evidence review
        run: npm run test:texture-projection-review

      - name: Test texture bake readiness preflight
        run: npm run test:texture-bake-readiness

      - name: Test texture atlas packing and UV remapping
        run: npm run test:texture-atlas

      - name: Test GLB texture binding and atlas verification
        run: npm run test:glb-texture-binding-qa

      - name: Test mesh UV seam candidates
        run: npm run test:uv-seam-review

      - name: Test texture pixel content and resolution risk hints
        run: npm run test:texture-image-content-review

      - name: Test multi-view render review manifest validation
        run: npm run test:render-review-manifest

      - name: Test evidence-linked render reference review
        run: npm run test:render-reference-review

      - name: Test render/reference image similarity diagnostics
        run: npm run test:render-image-similarity-diagnostics

      - name: Test evidence-linked similarity diagnostics in the reference-review workflow
        run: npm run test:render-reference-diagnostics-attachment
      - name: Test evidence-linked render correction task backlog
        run: npm run test:render-correction-tasks

      - name: Test evidence-gated correction verification cycle
        run: npm run test:render-correction-verification

      - name: Test building release readiness evidence gate
        run: npm run test:building-release-readiness

      - name: Test immutable building review package
        run: npm run test:building-review-package

      - name: Test offline review package integrity verifier
        run: npm run test:building-review-package-integrity

      - name: Test Ed25519 review package manifest signatures
        run: npm run test:building-review-package-signature

      - name: Test evidence-based building accuracy benchmark
        run: npm run test:building-accuracy-benchmark

      - name: Validate Blender render automation Python syntax
        run: python3 -m py_compile scripts/blender/render-building-review.py

      - name: Test textured PLY conversion and COLMAP reconstruction worker contract
        run: npm run test:colmap-worker

      - name: Test single-image AI-to-GLB preview worker
        run: npm run test:single-image-3d

      - name: Test camera-aware viewport feature budget
        run: npm run test:viewport-budget

      - name: Test camera-aware facade LOD budget
        run: npm run test:lod-budget

      - name: Test viewport spatial sampling
        run: npm run test:viewport-selection

      - name: Test viewport response cache and cancellation policy
        run: npm run test:viewport-cache && npm run test:viewport-load-policy

      - name: Test building search index
        run: npm run test:building-search

      - name: Test building footprint area calculations
        run: npm run test:footprint-area

      - name: Test nearby-place query and normalization
        run: npm run test:nearby-places

      - name: Test property listing filters and nearby-service matching
        run: npm run test:property-listings

      - name: Test street imagery validation and reference normalization
        run: npm run test:street-imagery

      - name: Test architecture research filters and metadata
        run: npm run test:architecture-research

      - name: Test OSM road network query and width normalization
        run: npm run test:road-network

      - name: Test source-derived building facade styles
        run: npm run test:building-style

      - name: Generate parametric Ahsan Manzil LOD assets
        run: npm run build:heritage-model

      - name: Test heritage model GLBs, parameters and map navigation
        run: npm run test:heritage-model

      - name: Upload generated Ahsan Manzil GLB assets
        uses: actions/upload-artifact@v4
        with:
          name: ahsan-manzil-generated-glb
          path: |
            public/models/ahsan-manzil-lod1.glb
            public/models/ahsan-manzil-lod2.glb
            public/models/ahsan-manzil-lod3.glb
            public/models/ahsan-manzil.glb
          if-no-files-found: error
          retention-days: 2

      - name: Build Overture spatial tiles
        run: npm run build:geospatial-tiles

      - name: Test generated spatial tiles
        run: npm run test:geospatial-tiles

      - name: Build production app
        run: npm run build

      - name: Verify viewport API against the production server
        env:
          GEOSPATIAL_API_BASE_URL: http://127.0.0.1:3000
        run: |
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3000 > /tmp/geospatial-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          node --input-type=module <<'NODE'
          const endpoint = "http://127.0.0.1:3000/api/geospatial/overture-buildings/viewport";
          const deadline = Date.now() + 60000;
          let ready = false;

          while (Date.now() < deadline) {
            try {
              const response = await fetch(endpoint);
              await response.arrayBuffer();
              if (response.status === 400) {
                ready = true;
                break;
              }
            } catch {
              // The production server is still starting.
            }

            await new Promise((resolve) => setTimeout(resolve, 1000));
          }

          if (!ready) {
            console.error("Next.js production server did not become ready.");
            process.exit(1);
          }

          const nearby = await fetch(
            "http://127.0.0.1:3000/api/geospatial/nearby-places",
          );
          if (nearby.status !== 400) {
            console.error("Nearby places endpoint should reject a request without coordinates.");
            process.exit(1);
          }

          const properties = await fetch(
            "http://127.0.0.1:3000/api/geospatial/properties",
          );
          if (properties.status !== 400) {
            console.error("Property endpoint should reject a request without coordinates.");
            process.exit(1);
          }

          const streetImagery = await fetch(
            "http://127.0.0.1:3000/api/geospatial/street-imagery",
          );
          if (streetImagery.status !== 400) {
            console.error("Street imagery endpoint should reject a request without coordinates.");
            process.exit(1);
          }

          const roads = await fetch(
            "http://127.0.0.1:3000/api/geospatial/roads",
          );
          if (roads.status !== 400) {
            console.error("Road network endpoint should reject a request without viewport bounds.");
            process.exit(1);
          }

          const architectureResearch = await fetch(
            "http://127.0.0.1:3000/api/geospatial/architecture-research?limit=50",
          );
          const architecturePayload = await architectureResearch.json();
          if (
            !architectureResearch.ok ||
            architecturePayload.dataStatus !== "curated-research" ||
            !Array.isArray(architecturePayload.results) ||
            architecturePayload.results.length < 1 ||
            !architecturePayload.results[0].designProfile?.colorPalette
          ) {
            console.error("Architecture research endpoint failed its catalogue smoke test.");
            process.exit(1);
          }

          const filteredArchitecture = await fetch(
            "http://127.0.0.1:3000/api/geospatial/architecture-research?area=Mugda&mediaType=image",
          );
          const filteredArchitecturePayload = await filteredArchitecture.json();
          if (
            !filteredArchitecture.ok ||
            !Array.isArray(filteredArchitecturePayload.results) ||
            !filteredArchitecturePayload.results.every((item) =>
              item.locationText.toLowerCase().includes("mugda") && item.mediaType === "image"
            )
          ) {
            console.error("Architecture research endpoint failed a filtered catalogue smoke test.");
            process.exit(1);
          }

          const commonsMedia = await fetch(
            "http://127.0.0.1:3000/api/geospatial/architecture-research?q=Mugda&mediaType=image&limit=10",
          );
          const commonsPayload = await commonsMedia.json();
          if (
            !commonsMedia.ok ||
            !commonsPayload.results?.some((item) =>
              item.id === "R02" &&
              item.mediaPreviewKind === "image" &&
              typeof item.mediaPreviewUrl === "string" &&
              item.mediaPreviewUrl.includes("commons.wikimedia.org")
            )
          ) {
            console.error("Architecture research endpoint failed its reuse-aware image preview smoke test.");
            process.exit(1);
          }

          const videoMedia = await fetch(
            "http://127.0.0.1:3000/api/geospatial/architecture-research?mediaType=video&limit=10",
          );
          const videoPayload = await videoMedia.json();
          if (
            !videoMedia.ok ||
            !videoPayload.results?.some((item) =>
              item.mediaType === "video" &&
              item.mediaPreviewKind === "video" &&
              typeof item.mediaPreviewUrl === "string" &&
              item.mediaPreviewUrl.startsWith("https://www.youtube-nocookie.com/embed/")
            )
          ) {
            console.error("Architecture research endpoint failed its validated YouTube context preview smoke test.");
            process.exit(1);
          }

          const propertySearch = await fetch(
            "http://127.0.0.1:3000/api/geospatial/properties?lat=23.7461&lon=90.3742&radius=20000&minRent=20000&maxRent=40000&minBedrooms=2&type=apartment&limit=10",
          );
          const propertyPayload = await propertySearch.json();
          if (
            !propertySearch.ok ||
            propertyPayload.dataStatus !== "demo" ||
            !Array.isArray(propertyPayload.results) ||
            propertyPayload.results.length === 0
          ) {
            console.error("Property endpoint failed a valid filtered-search smoke test.");
            process.exit(1);
          }
          NODE

          npm run test:geospatial-api
