name: P3.7 Floor-plan raster vector calibration

on:
  push:
    branches:
      - feat/p3-7-floor-plan-vector-calibration
  pull_request:
    branches:
      - development
    paths:
      - "src/core/building-generation/floor-plan-raster-vector-calibration.mjs"
      - "src/core/building-generation/floor-plan-model.mjs"
      - "scripts/calibrate-floor-plan-raster-vectors.mjs"
      - "tests/floor-plan-raster-vector-calibration.test.mjs"
      - "tests/floor-plan-raster-vector-calibration-cli.test.mjs"
      - "tests/floor-plan-model.test.mjs"
      - "tests/floor-plan-model-cli.test.mjs"
      - "tests/floor-plan-raster-line-proposals.test.mjs"
      - "tests/floor-plan-raster-line-job.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "docs/research/P3-7-FLOOR-PLAN-VECTOR-CALIBRATION.md"
      - "docs/ENGINE-REMAINING-WORK-ROADMAP.md"
      - ".github/workflows/p3-7-floor-plan-vector-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-7-floor-plan-vector-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrated-vector-review:
    name: Calibrated vector draft and geometry integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Test calibrated vector conversion and CLI source-byte binding
        run: npm run test:floor-plan-raster-vector-calibration

      - name: Test existing measured floor-plan geometry generator
        run: npm run test:floor-plan-model

      - name: Test existing raster line extraction and private proposal integrity
        run: npm run test:floor-plan-raster-line-proposals && npm run test:floor-plan-raster-line-job

      - name: Lint the P3.7 implementation and regression suite
        run: npm run lint -- src/core/building-generation/floor-plan-raster-vector-calibration.mjs scripts/calibrate-floor-plan-raster-vectors.mjs tests/floor-plan-raster-vector-calibration.test.mjs tests/floor-plan-raster-vector-calibration-cli.test.mjs
