name: BRF-13 Drone image source-byte intake

on:
  pull_request:
    branches:
      - development
    paths:
      - ".github/workflows/brf-13-drone-image-intake.yml"
      - "benchmarks/building-reconstruction/brf-13-drone-image-source.json"
      - "scripts/verify-brf13-drone-image-source.mjs"
      - "tests/brf13-drone-image-source-intake.test.mjs"
  push:
    branches:
      - development
    paths:
      - ".github/workflows/brf-13-drone-image-intake.yml"
      - "benchmarks/building-reconstruction/brf-13-drone-image-source.json"
      - "scripts/verify-brf13-drone-image-source.mjs"
      - "tests/brf13-drone-image-source-intake.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brf-13-drone-image-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-one-imagery-asset:
    name: Verify one rights-declared source image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test fail-closed source-byte verifier
        run: node --test tests/brf13-drone-image-source-intake.test.mjs

      - name: Download one image to runner temporary storage
        env:
          IMAGE_URL: https://huggingface.co/datasets/Matt1up/drone-building-scans/resolve/main/flat-roof/images/DJI_20260822183442_0005_D.JPG
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brf13" artifacts/brf-13-source-intake
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            "$IMAGE_URL" --output "$RUNNER_TEMP/brf13/DJI_20260822183442_0005_D.JPG"

      - name: Verify actual size and SHA-256 from downloaded bytes
        run: |
          node scripts/verify-brf13-drone-image-source.mjs \
            --manifest benchmarks/building-reconstruction/brf-13-drone-image-source.json \
            --file "$RUNNER_TEMP/brf13/DJI_20260822183442_0005_D.JPG" \
            --report artifacts/brf-13-source-intake/source-image-byte-verification.json

      - name: Upload only the byte-verification report (not the source image)
        uses: actions/upload-artifact@v4
        with:
          name: brf-13-source-image-byte-verification
          path: artifacts/brf-13-source-intake/source-image-byte-verification.json
          if-no-files-found: error
          retention-days: 7
