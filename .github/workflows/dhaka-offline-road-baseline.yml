name: Dhaka Offline Road Extract Baseline

on:
  push:
    branches:
      - rakibul-hasan
    paths:
      - "src/app/api/geospatial/roads/**"
      - "src/core/geospatial/offline-road-extract.*"
      - "src/core/geospatial/road-network.*"
      - "src/core/map-engine/road-layer-manager.ts"
      - "scripts/prepare-dhaka-road-extract.mjs"
      - "scripts/benchmark-map-browser.mjs"
      - "tests/offline-road-extract.test.mjs"
      - "tests/prepare-dhaka-road-extract.test.mjs"
      - "tests/map-browser-baseline.test.mjs"
      - ".github/workflows/dhaka-offline-road-baseline.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhaka-offline-road-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Build OSM extract and verify offline road render
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Osmium and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool
          npx playwright install --with-deps chromium

      - name: Download and identify the official Bangladesh OSM extract
        id: osm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/offline-road/data artifacts/offline-road/baseline
          source_url="https://download.geofabrik.de/asia/bangladesh-latest.osm.pbf"
          source_pbf="$RUNNER_TEMP/bangladesh-latest.osm.pbf"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            "$source_url" --output "$source_pbf"
          source_sha256="$(sha256sum "$source_pbf" | awk '{print $1}')"
          source_timestamp="$(osmium fileinfo -g data.timestamp "$source_pbf")"
          source_date="${source_timestamp%%T*}"
          if ! [[ "$source_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Could not read the OSM source timestamp from the downloaded PBF: $source_timestamp"
            exit 1
          fi
          {
            echo "source_url=$source_url"
            echo "source_sha256=$source_sha256"
            echo "source_date=$source_date"
            echo "source_pbf_path=$source_pbf"
          } >> "$GITHUB_OUTPUT"
          printf 'Official source URL: %s\nSource date: %s\nSource SHA-256: %s\n' "$source_url" "$source_date" "$source_sha256" \
            | tee artifacts/offline-road/baseline/source-manifest.txt

      - name: Clip Dhaka coverage and export road geometries
        env:
          SOURCE_PBF: ${{ steps.osm.outputs.source_pbf_path }}
        shell: bash
        run: |
          set -euo pipefail
          clipped="$RUNNER_TEMP/dhaka-area.osm.pbf"
          roads_pbf="$RUNNER_TEMP/dhaka-roads.osm.pbf"
          roads_geojson="$RUNNER_TEMP/dhaka-roads.geojson"
          # Coverage is explicitly recorded in the output extract: 90.30–90.55°E, 23.60–23.90°N.
          osmium extract --strategy=smart -b 90.30,23.60,90.55,23.90 "$SOURCE_PBF" -o "$clipped"
          osmium tags-filter "$clipped" w/highway -o "$roads_pbf"
          osmium export "$roads_pbf" --geometry-types=linestring -o "$roads_geojson"
          test -s "$roads_geojson"
          printf 'Clipped PBF bytes: %s\nRoad GeoJSON bytes: %s\n' \
            "$(stat -c '%s' "$clipped")" "$(stat -c '%s' "$roads_geojson")" \
            | tee -a artifacts/offline-road/baseline/source-manifest.txt

      - name: Build and validate the versioned offline road extract
        env:
          SOURCE_URL: ${{ steps.osm.outputs.source_url }}
          SOURCE_SHA256: ${{ steps.osm.outputs.source_sha256 }}
          SOURCE_DATE: ${{ steps.osm.outputs.source_date }}
        run: |
          set -euo pipefail
          npm run prepare:dhaka-road-extract -- \
            --input "$RUNNER_TEMP/dhaka-roads.geojson" \
            --output artifacts/offline-road/data/dhaka-road-network-v1.json \
            --source-url "$SOURCE_URL" \
            --source-date "$SOURCE_DATE" \
            --source-sha256 "$SOURCE_SHA256" \
            --west 90.30 --south 23.60 --east 90.55 --north 23.90 \
            --max-features 200000 \
            > artifacts/offline-road/baseline/import-report.json

      - name: Build and validate the Overture map fixture
        run: npm run build:geospatial-tiles && npm run test:geospatial-tiles

      - name: Start the map with the generated offline road extract
        env:
          DHAKA_ROADS_EXTRACT_PATH: artifacts/offline-road/data/dhaka-road-network-v1.json
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3000 \
            > "$RUNNER_TEMP/next-offline-road.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; cp "$RUNNER_TEMP/next-offline-road.log" artifacts/offline-road/baseline/dev-server.log 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/map -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/next-offline-road.log"
            echo "Next.js development server did not become ready."
            exit 1
          fi

          curl --fail --silent --show-error -D artifacts/offline-road/baseline/road-api-headers.txt \
            "http://127.0.0.1:3000/api/geospatial/roads?west=90.40&south=23.70&east=90.43&north=23.73&limit=800" \
            -o artifacts/offline-road/baseline/road-api-smoke.json

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const payload = JSON.parse(await readFile("artifacts/offline-road/baseline/road-api-smoke.json", "utf8"));
          assert.equal(payload.dataStatus, "openstreetmap-road-network");
          assert.equal(payload.detailLevel, "offline", "API did not use the configured local extract");
          assert.ok(Number.isSafeInteger(payload.count) && payload.count > 0, "offline API returned no roads");
          assert.equal(payload.license, "ODbL 1.0");
          assert.match(payload.attribution, /OpenStreetMap contributors/);
          assert.ok(typeof payload.sourceDate === "string" && payload.sourceDate.length === 10);
          assert.ok(Array.isArray(payload.results) && payload.results.length > 0);
          assert.ok(payload.results.every((road) => road.source === "OpenStreetMap regional extract"));
          console.log(JSON.stringify({ detailLevel: payload.detailLevel, count: payload.count, sourceDate: payload.sourceDate, license: payload.license }, null, 2));
          NODE

          npm run benchmark:map-browser

      - name: Verify six browser samples contain rendered offline roads
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile("artifacts/offline-road/baseline/report.json", "utf8"));
          assert.equal(report.runs.length, 6, "expected three cold and three warm runs");
          assert.equal(report.summary.cold.successfulRuns, 3);
          assert.equal(report.summary.warm.successfulRuns, 3);
          const extract = report.candidate.dataInputs.find((entry) => entry.path === "artifacts/offline-road/data/dhaka-road-network-v1.json");
          assert.ok(extract?.exists && /^[a-f0-9]{64}$/.test(extract.sha256), "offline extract hash is missing");
          for (const run of report.runs) {
            assert.equal(run.status, "ok", run.mode + "-" + run.index + " browser sample failed");
            assert.equal(run.roadReadiness.status, "rendered", run.mode + "-" + run.index + " road layer not rendered");
            assert.ok(run.roadReadiness.renderedFeatureCount > 0, "no road features were added to Cesium");
            assert.equal(run.network.roadApi.pendingRequestsAtCapture, 0, "road requests still pending at screenshot capture");
            assert.ok(run.network.roadApi.detailLevelResponses.offline > 0, "sample did not receive offline road response");
            assert.ok(run.network.roadApi.sourceResponses["local-extract"] > 0, "sample did not use local extract");
            assert.equal(run.network.roadApi.upstreamAttempts.total, 0, "covered viewport unexpectedly queried Overpass");
            assert.ok(/^[a-f0-9]{64}$/.test(run.screenshot.sha256), "screenshot digest missing");
          }
          console.log("Validated all six cold/warm samples with a positive offline road render and a pinned extract hash.");
          NODE

      - name: Upload the offline extract and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhaka-offline-road-baseline-${{ github.sha }}
          path: |
            artifacts/offline-road/data/dhaka-road-network-v1.json
            artifacts/offline-road/baseline/
          if-no-files-found: warn
          retention-days: 14
